data_root: "/home/jason/DoorOpeningProject/data/processed_data"
checkpoint_dir: "/home/jason/DoorOpeningProject/bc_policy/checkpoints_stride_1_obs_1_pred_1_single_batch"

# Dataset settings
use_image: False           # Proprio-only mode (set to True for vision)
image_resize_size: null    # Only used if use_image=True

action_dim: 10          # [left_hand_pos(3), right_hand_pos(3), base_vel(2), yaw_speed(1), grasp(1)]
proprio_dim: 29         # Robot joint angles (q_0 to q_28)

# Data loading
obs_horizon: 1          # Number of past observations to use
pred_horizon: 1        # Number of future actions to predict
sample_stride: 1        # Sample every N-th timestep (1=no skip)

# Model architecture
hidden_dims: [512, 512, 512]  # MLP hidden layer dimensions
activation: "relu"             # Activation function: relu, elu, gelu
use_layer_norm: True          # Use layer normalization

# Training settings
device: "cuda"
batch_size: 64
num_epochs: 5000
learning_rate: 1.0e-3
weight_decay: 1.0e-4
grad_clip: 1.0

# Optimizer
optimizer: "adam"       # adam or adamw
scheduler: "cosine"     # cosine, step, or none
warmup_epochs: 10

# Data augmentation (for robustness) - ENHANCED
noise_std: 0.01         # Add Gaussian noise to proprioception (std in radians)
                        # 0.01 rad ≈ 0.57 degrees - realistic sensor noise
temporal_dropout: 0.1   # 10% chance to replace observation with previous timestep
                        # Simulates observation delay/dropped frames
action_noise_std: 0.005 # Add small noise to actions for regularization
                        # Helps policy be robust to small command variations

# Logging
log_interval: 10        # Log every N batches
eval_interval: 1        # Evaluate every N epochs
save_interval: 5        # Save checkpoint every N epochs

# DataLoader
num_workers: 4
pin_memory: True
