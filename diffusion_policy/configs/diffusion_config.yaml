data_root: "/home/jason/DoorOpeningProject/data/processed_data"
checkpoint_dir: "/home/jason/DoorOpeningProject/diffusion_policy/checkpoints"

# Dataset settings
use_image: False           # Proprio-only mode (set to True for vision)
image_resize_size: null    # Only used if use_image=True

action_dim: 10          # [left_hand_pos(3), right_hand_pos(3), base_vel(2), yaw_speed(1), grasp(1)]
proprio_dim: 29         # Robot joint angles (q_0 to q_28)
stage_dim: 5            # Stage one-hot encoding (5 stages)

# Data loading
obs_horizon: 2          # Number of past observations to use
pred_horizon: 16        # Number of future actions to predict
action_horizon: 8       # Number of actions to execute before replanning
sample_stride: 1        # Sample every N-th timestep (1=no skip)

# Model architecture - Diffusion
# Observation encoder
obs_encoder_type: "mlp"  # "mlp" or "transformer"
obs_embedding_dim: 256   # Observation embedding dimension

# Noise prediction network (U-Net style)
diffusion_step_embed_dim: 128  # Diffusion timestep embedding
down_dims: [256, 512, 1024]    # Downsample dimensions
kernel_size: 5                  # 1D conv kernel size
n_groups: 8                     # Group normalization groups

# Diffusion process
num_diffusion_iters: 100        # Number of denoising steps during training
num_inference_steps: 10         # Number of denoising steps during inference (DDIM)
beta_schedule: "squaredcos_cap_v2"  # Noise schedule

# Training settings
device: "cuda"
batch_size: 64
num_epochs: 300
learning_rate: 1.0e-4
weight_decay: 1.0e-6
grad_clip: 1.0
ema_decay: 0.995        # Exponential moving average for model weights

# Optimizer
optimizer: "adamw"
scheduler: "cosine"     # cosine, step, or none
warmup_epochs: 10

# Data augmentation
noise_std: 0.01         # Add Gaussian noise to proprioception
temporal_dropout: 0.0   # Temporal dropout for robustness
action_noise_std: 0.0   # Action noise for regularization

# Logging
log_interval: 10        # Log every N batches
eval_interval: 1        # Evaluate every N epochs
save_interval: 10       # Save checkpoint every N epochs

# DataLoader
num_workers: 4
pin_memory: True
